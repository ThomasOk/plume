<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plume — a minimal note-taking app to capture your thoughts."
    />
    <meta property="og:title" content="Plume" />
    <meta
      property="og:description"
      content="Plume — a minimal note-taking app to capture your thoughts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://useplume.me" />
    <script>
      (() => {
        /*
         * Avoid flickering screen when refreshing on dark mode
         * https://dev.to/izznatsir/flicker-free-dark-mode-in-vite-spa-180o
         */
        const classList = document.documentElement.classList;
        const style = document.documentElement.style;
        const dark = window.matchMedia('(prefers-color-scheme: dark)');

        const update = () => {
          classList.remove('dark', 'paper');
          if (localStorage.theme === 'dark') {
            classList.add('dark');
            style.colorScheme = 'dark';
          } else if (localStorage.theme === 'paper') {
            classList.add('paper');
            style.colorScheme = 'light';
          } else if (!localStorage.theme && dark.matches) {
            classList.add('dark');
            style.colorScheme = 'dark';
          } else {
            style.colorScheme = 'light';
          }
        };
        update();

        if (dark instanceof EventTarget) {
          dark.addEventListener('change', () => {
            delete localStorage.theme;
            update();
          });
        } else {
          dark.addListener(() => {
            delete localStorage.theme;
            update();
          });
        }
        window.addEventListener('storage', update);
      })();
    </script>
    <title>Plume</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
